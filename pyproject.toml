[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagramchess"
version = "0.1.0"
description = "Chess PDF companion: find diagrams in chess books, read the position, open it on Lichess."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Rey" }]
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10",
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
    "chess>=1.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8"]

[project.scripts]
dgc = "diagramchess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diagramchess = ["review/static/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
